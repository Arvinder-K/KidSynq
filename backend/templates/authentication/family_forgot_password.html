{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block clean_content %}
<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-key-fill fs-2 text-primary"></i>
            </div>
            <h3 class="fw-bold text-slate-800 mb-1">Reset Password</h3>
            <p class="text-muted small">Enter your email address and we'll send you recovery instructions</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
