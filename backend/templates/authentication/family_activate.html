{% extends "base.html" %}

{% block title %}Activate Family Account{% endblock %}

{% block clean_content %}
<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-shield-check fs-2 text-primary"></i>
            </div>
            <h3 class="fw-bold text-slate-800 mb-1">Activate Your Account</h3>
            <p class="text-muted small">Create your password to complete registration for KidSynq Family Portal</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="token" value="{{ token }}">

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-muted">Create Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label small fw-semibold text-muted">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                Activate Account & Continue
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}?type=family" class="small text-muted text-decoration-none">Already activated? Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
