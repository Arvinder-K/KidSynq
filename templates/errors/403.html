{% extends "base.html" %}

{% block title %}Access Denied (403) - KidSynq{% endblock %}

{% block clean_content %}
<div class="card border-0 shadow-sm text-center p-5 rounded-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mx-auto mb-3" style="width: 80px; height: 80px;">
        <i class="bi bi-shield-x fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-slate-800 mb-2">403</h1>
    <h4 class="fw-semibold text-slate-700 mb-3">Access Denied</h4>
    <p class="text-muted mb-4 mx-auto" style="max-width: 450px;">
        You do not have the required permissions or credentials to access this protected area.
    </p>
    <div>
        <a href="{% url 'dashboard_router' %}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
